# The Linux release's binaries, built in Debian 11 (bullseye) as the release always was, so every shipped binary
# needs only glibc 2.29 (exp and pow; tools/check_glibc_floor.sh): ./build_linux.sh, then the checks that need no
# firmware (tools/linux_ci_checks.sh: the keyboard, the display, the sound buffer and their controls, the CPU contract
# tests, the no-GPL audit, no build path, the GLIBC floor).  The firmware never comes here, not even as a secret:
# the whole gate with the firmware (tools/linux_tests.sh), the package, the wheel and the emulator archive are made on
# the Raspberry Pi from this run's artifact (tools/release_from_ci.sh).
#
# Artifact linux-build-<arch>: linux-build-<arch>.tar.gz (a tar, so the programs keep their executable bits) holding
# build/linux (without its object folders), src/ssi263/_bin/linux-<machine> and COMMIT (the full commit built).
#
# armhf is not built here: GitHub's arm64 runners cannot run 32-bit ARM code, so armhf stays on the Pi (its
# bullseye chroot, under linux32).
#
# workflow_dispatch's ref: build another commit with this workflow's own checks (the commit may predate them):
#     gh workflow run linux.yml --ref main -f ref=<commit>
name: Linux
run-name: Linux build of ${{ inputs.ref || github.sha }}

on:
  push:
    branches: [main, linux-ci]
    paths:
      - "build_linux.sh"
      - "src/csrc/**"
      - "src/apps/blazie/**"
      - "src/platforms/speechd/**"
      - "src/platforms/btspeak/**"
      - "src/ssi263/**"
      - "python/**"
      - "third_party/casso/**"
      - "tools/linux_*.sh"
      - "tools/check_no_gpl.py"
      - "tools/check_glibc_floor.sh"
      - "tools/build_bt_frontend.py"
      - ".github/workflows/linux.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit to build (default: the one this run is on)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }} (Debian 11)
    runs-on: ${{ matrix.runner }}
    container: debian:bullseye
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    env:
      PYTHON_COLORS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
    steps:
      # the Pi's chroots' sources (no security line: bullseye's LTS has ended and its security pool 404s) and their
      # packages (the Pi's mkchroot.sh), and git for a real checkout
      - name: Debian 11's build packages
        run: |
          printf 'deb http://deb.debian.org/debian bullseye main\ndeb http://deb.debian.org/debian bullseye-updates main\n' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git ca-certificates \
            build-essential g++ pkg-config python3 python3-venv libasound2-dev libpulse-dev libgtk-3-dev \
            binutils file diffutils procps

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # this workflow's own checks, whatever commit is built
      - uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: tools

      - name: Toolchain
        run: |
          echo "commit: $(git -c safe.directory='*' rev-parse HEAD)"
          echo "debian $(cat /etc/debian_version), $(uname -m), $(ldd --version | head -n 1)"
          gcc --version | head -n 1; python3 --version

      - name: Build
        run: |
          ./build_linux.sh > build.log 2>&1 || { tail -n 40 build.log; exit 1; }
          grep -E '^(built|skipped|NOT built)' build.log

      - name: Checks without firmware
        run: sh .ci/tools/linux_ci_checks.sh "$PWD"

      - name: Pack the build
        run: |
          git -c safe.directory='*' rev-parse HEAD > COMMIT
          tar --exclude='build/linux/obj*' --exclude='build/linux/*.o' -czf "linux-build-${{ matrix.arch }}.tar.gz" \
            COMMIT build/linux "src/ssi263/_bin/linux-$(uname -m)"
          tar -tzf "linux-build-${{ matrix.arch }}.tar.gz" | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ matrix.arch }}
          path: linux-build-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
